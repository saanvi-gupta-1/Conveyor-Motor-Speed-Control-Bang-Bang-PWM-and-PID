[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conveyor-motor-control"
version = "1.0.0"
description = "Reproducible DC conveyor motor control simulation"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7", "rich>=13.0", "numpy>=1.24"]

[project.optional-dependencies]
visual = ["pybullet>=3.2.6"]
dev = ["pytest>=7.4"]

[project.scripts]
conveyor-control = "conveyor_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
